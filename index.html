    <meta name="linkedin:image" content="/og-cover.png" />

    <!-- Dynamic Subdomain & Protocol Open Graph URL Resolver for WhatsApp & LinkedIn Crawlers -->
    <script>
      (function() {
        try {
          if (typeof window !== 'undefined' && window.location) {
            var origin = window.location.origin;
            var currentUrl = window.location.href;

            // Fix Canonical
            var canonical = document.querySelector('link[rel="canonical"]');
            if (canonical) canonical.setAttribute('href', currentUrl);

            // Fix og:url
            var ogUrl = document.querySelector('meta[property="og:url"]');
            if (ogUrl) ogUrl.setAttribute('content', currentUrl);

            // Fix absolute image URLs for WhatsApp, LinkedIn & Telegram crawlers
            var absoluteCoverUrl = origin + '/og-cover.png';
            var metaOgImg = document.querySelector('meta[property="og:image"]');
            var metaOgImgUrl = document.querySelector('meta[property="og:image:url"]');
            var metaOgImgSecure = document.querySelector('meta[property="og:image:secure_url"]');
            var metaTwitterImg = document.querySelector('meta[name="twitter:image"]');
            var metaLinkedinImg = document.querySelector('meta[name="linkedin:image"]');

            if (metaOgImg) metaOgImg.setAttribute('content', absoluteCoverUrl);
            if (metaOgImgUrl) metaOgImgUrl.setAttribute('content', absoluteCoverUrl);
            if (metaOgImgSecure) metaOgImgSecure.setAttribute('content', absoluteCoverUrl);
            if (metaTwitterImg) metaTwitterImg.setAttribute('content', absoluteCoverUrl);
            if (metaLinkedinImg) metaLinkedinImg.setAttribute('content', absoluteCoverUrl);
          }
        } catch (e) {}
      })();
    </script>
