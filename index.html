<!doctype html>
<html lang="vi" prefix="og: https://ogp.me/ns#">
  <head>
    <meta charset="UTF-8" />
    <!--
      Nạp sớm ảnh màn hình chào.
      Không có dòng này, trình duyệt chỉ biết tới /splash.jpg sau khi đã tải và
      chạy xong gói JavaScript — tức là đúng lúc màn hình chào cần hiện thì ảnh
      mới bắt đầu tải, và học viên nhìn thấy nền trơn trong phần lớn 3 giây đó.
      `fetchpriority=high` để nó không xếp hàng sau các tệp khác.
    -->
    <link rel="preload" as="image" href="/splash.jpg" fetchpriority="high" />
    <link rel="icon" type="image/jpeg" href="/pmarcom-logo.jpg" />
    <link rel="apple-touch-icon" href="/pmarcom-logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>HỌC VIỆN P MARCOM | Khóa Học Digital Thực Chiến</title>
    <meta name="title" content="HỌC VIỆN P MARCOM | Khóa Học Digital Thực Chiến" />
    <meta name="description" content="Học viện P MARCOM - Khóa học Digital Thực chiến bài bản với 11 chuyên đề, trắc nghiệm tình huống, từ điển thuật ngữ và bản tin thuật toán Meta, TikTok, Google." />
    <meta name="keywords" content="Học viện P MARCOM, Khóa học Digital Thực chiến, Digital Marketing, CPM, ROAS, CAC, CPL, Meta Ads, TikTok Ads, Google Search Ads, SEO" />
    <meta name="author" content="HỌC VIỆN P MARCOM" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#F0EAD6" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://academy.pmarcom.com/" />

    <!--
      Open Graph / Facebook / Zalo / WhatsApp / Viber / LINE / LinkedIn / Telegram / Messenger

      MỌI URL Ở ĐÂY PHẢI TUYỆT ĐỐI. Trình quét của Zalo, WhatsApp, Viber và LINE
      không chạy JavaScript và không phân giải đường dẫn tương đối - đưa cho
      chúng "/og-cover.png" thì chúng bỏ qua ảnh và chỉ hiện tiêu đề trống.

      Đổi tên miền thì phải sửa đồng loạt: canonical, og:url, 3 thẻ og:image,
      twitter:image, linkedin:image, link[rel=image_src], itemprop=image và khối
      JSON-LD ở cuối head.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HỌC VIỆN P MARCOM" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:url" content="https://academy.pmarcom.com/" />
    <meta property="og:title" content="HỌC VIỆN P MARCOM | Khóa Học Digital Thực Chiến" />
    <meta property="og:description" content="Khóa học Digital Thực chiến bài bản với 11 chuyên đề, trắc nghiệm tình huống thực tế, từ điển chỉ số CPM/ROAS/CAC và cấp Bằng Chứng Nhận chính thức." />
    
    <!--
      Ảnh bìa xem trước. Tên tệp đánh số -v3 thay vì gắn ?v= vào sau: Zalo và
      một vài trình quét cũ chuẩn hoá mất phần query rồi lấy lại bản cũ trong
      bộ nhớ đệm, đổi hẳn tên tệp thì chắc chắn chúng phải tải lại. Thay ảnh bìa
      lần sau thì đánh -v4, đừng ghi đè tệp này.

      Kích thước thật là 1672x941 (tỉ lệ 16:9), KHÔNG phải 1200x630 như khuyến
      nghị của Facebook. Chủ dự án chọn dùng chung một tệp cho cả thẻ chia sẻ lẫn
      banner trong trang (2026-07-30). Hệ quả đã biết và chấp nhận: khi chia sẻ
      link, Facebook và Zalo cắt bớt trên dưới để về 1.91:1, phần bị mất là hàng
      bốn biểu tượng dưới cùng. Khối chữ ở giữa nằm trong vùng an toàn.

      Định dạng JPEG chứ không phải PNG: bản PNG gốc nặng 1.982 KB, quá nặng cho
      một ảnh hiện ngay khi mở trang trên 4G. Bản JPEG chất lượng 86 còn 279 KB,
      mắt thường không phân biệt được. Bản PNG gốc không giữ trong kho mã (nặng
      2MB mà không file nào dùng tới); cần lại thì lấy từ lịch sử git:
      git show 5a5d6e7:src/assets/og-cover-v3-goc.png > goc.png
    -->
    <meta property="og:image" content="https://academy.pmarcom.com/og-cover-v3.jpg" />
    <meta property="og:image:url" content="https://academy.pmarcom.com/og-cover-v3.jpg" />
    <meta property="og:image:secure_url" content="https://academy.pmarcom.com/og-cover-v3.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1672" />
    <meta property="og:image:height" content="941" />
    <meta property="og:image:alt" content="HỌC VIỆN P MARCOM - Banner Đào Tạo Trưởng Phòng Digital Marketing" />

    <!-- Twitter Card / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@pmarcom_academy" />
    <meta name="twitter:title" content="HỌC VIỆN P MARCOM | Đào Tạo Trưởng Phòng Digital Marketing Thực Chiến" />
    <meta name="twitter:description" content="Chương trình đào tạo Trưởng phòng Digital Marketing bài bản với 11 chuyên đề thực chiến, trắc nghiệm tình huống thực tế, từ điển chỉ số CPM/ROAS/CAC và cấp Bằng Chứng Nhận chính thức." />
    <meta name="twitter:image" content="https://academy.pmarcom.com/og-cover-v3.jpg" />
    <meta name="twitter:image:alt" content="HỌC VIỆN P MARCOM - Banner Đào Tạo Trưởng Phòng Digital Marketing" />

    <!-- LinkedIn Specific Tags -->
    <meta name="linkedin:title" content="HỌC VIỆN P MARCOM | Đào Tạo Trưởng Phòng Digital Marketing Thực Chiến" />
    <meta name="linkedin:description" content="Chương trình đào tạo Trưởng phòng Digital Marketing bài bản với 11 chuyên đề thực chiến, trắc nghiệm tình huống thực tế, từ điển chỉ số CPM/ROAS/CAC và cấp Bằng Chứng Nhận chính thức." />
    <meta name="linkedin:image" content="https://academy.pmarcom.com/og-cover-v3.jpg" />

    <!--
      Thẻ ảnh kiểu cũ. Viber và một số phiên bản Zalo, LINE đời trước không đọc
      og:image mà tìm link[rel=image_src] hoặc microdata itemprop=image.
      Giữ lại để phủ hết các máy khách cũ, chi phí gần như bằng không.
    -->
    <link rel="image_src" href="https://academy.pmarcom.com/og-cover-v3.jpg" />
    <meta itemprop="name" content="HỌC VIỆN P MARCOM | Khóa Học Digital Thực Chiến" />
    <meta itemprop="description" content="Chương trình đào tạo Trưởng phòng Digital Marketing bài bản với 11 chuyên đề thực chiến, từ điển 121 thuật ngữ và Bằng Chứng Nhận chính thức." />
    <meta itemprop="image" content="https://academy.pmarcom.com/og-cover-v3.jpg" />

    <!--
      Dữ liệu có cấu trúc cho Google. Cần cho kết quả tìm kiếm dạng thẻ, đồng
      thời là một nguồn ảnh nữa cho các trình quét đọc JSON-LD.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "HỌC VIỆN P MARCOM",
      "url": "https://academy.pmarcom.com/",
      "logo": "https://academy.pmarcom.com/pmarcom-logo.jpg",
      "image": "https://academy.pmarcom.com/og-cover-v3.jpg",
      "description": "Chương trình đào tạo Trưởng phòng Digital Marketing bài bản với 11 chuyên đề thực chiến, 36 bài học, từ điển 121 thuật ngữ và Bằng Chứng Nhận chính thức.",
      "slogan": "Học thật - Chiến thật - Kết quả thật",
      "inLanguage": "vi-VN"
    }
    </script>

    <!--
      ĐÃ GỠ: đoạn script trước đây ghi đè canonical và og:url bằng
      window.location.href, kèm ghi chú nói là để phục vụ trình quét WhatsApp
      và LinkedIn. Nó không làm được việc đó - các trình quét mạng xã hội không
      chạy JavaScript, nên chúng chỉ thấy HTML tĩnh. Ngược lại Googlebot CÓ
      dựng JavaScript, nên đoạn script đó biến mọi URL có tham số theo dõi
      (?utm_source=...) thành canonical của chính nó, làm loãng tín hiệu xếp
      hạng. Các thẻ tĩnh phía trên đã tuyệt đối và đầy đủ, không cần thay ở
      thời điểm chạy. Đừng thêm lại.
    -->

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Playfair Display: chữ serif cho họ tên trên bằng chứng nhận.
         Bắt buộc phải là font có bộ tiếng Việt đầy đủ (Google Fonts phục vụ
         kèm subset "vietnamese"). Trước đây dùng Georgia của Windows — font đó
         thiếu khối Latin Extended Additional nên "TRẦN" hiện thành "TRÂ`N". -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0e1526] text-slate-100 antialiased">
    <div id="root">
      <!-- High-End Initial Loading Splash Screen for Fast Initial Paint -->
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #F0EAD6; font-family: 'Plus Jakarta Sans', sans-serif; color: #1b2436; text-align: center; padding: 20px;">
        <div style="width: 80px; height: 80px; border-radius: 20px; border: 2px solid #6495ED; overflow: hidden; box-shadow: 0 0 30px rgba(100,149,237,0.28); margin-bottom: 16px;">
          <img src="/pmarcom-logo.jpg" alt="HỌC VIỆN P MARCOM Logo" style="width: 100%; height: 100%; object-fit: cover;" />
        </div>
        <div style="font-size: 11px; font-weight: 800; letter-spacing: 2px; color: #2b4faa; background: rgba(100,149,237,0.12); border: 1px solid rgba(100,149,237,0.35); padding: 4px 12px; border-radius: 20px; margin-bottom: 8px; text-transform: uppercase;">
          HỌC VIỆN P MARCOM
        </div>
        <h1 style="font-size: 20px; font-weight: 900; margin: 0 0 16px 0; color: #1b2436; letter-spacing: 0.5px;">
          KHÓA HỌC DIGITAL THỰC CHIẾN
        </h1>
        <div className="animate-spin" style="width: 32px; height: 32px; border: 3px solid rgba(100,149,237,0.25); border-top-color: #6495ED; border-radius: 50%;"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
